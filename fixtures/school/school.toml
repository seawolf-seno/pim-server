# A made-up school for development and tests. No real people.
# Never put a real name, login or roster in this repo (FERPA). pim-seed refuses
# any school file without `fictional = true` unless --real is given, and refuses
# --real inside a git repository.
fictional = true

domain = "pim.test"
rooms_domain = "rooms.pim.test"

# Staff who may open the safety archive (docs/policy.md). Every open is logged.
archive_readers = ["castellan"]

# Roles follow pacos-role: a login ending in a two-digit graduation year is a
# student; any other login is staff.
